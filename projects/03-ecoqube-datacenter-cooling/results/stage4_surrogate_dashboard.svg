<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Data Center Cooling Surrogate Dashboard Preview</title>
  <desc id="desc">Static preview of the Streamlit engineering dashboard for hotspot prediction, safety checking, bounded cooling recommendation and extrapolation awareness.</desc>
  <defs>
    <style>
      .bg { fill:#f7f9fc; }
      .panel { fill:#ffffff; stroke:#d8dee8; stroke-width:1.5; }
      .soft { fill:#eef3f8; }
      .ink { fill:#182230; font-family:Arial,Helvetica,sans-serif; }
      .muted { fill:#5e6b7a; font-family:Arial,Helvetica,sans-serif; }
      .accent { fill:#2764b8; }
      .good { fill:#16794b; }
      .warn { fill:#9a6700; }
      .bad { fill:#b42318; }
      .small { font-size:18px; }
      .body { font-size:21px; }
      .label { font-size:16px; font-weight:700; letter-spacing:.5px; }
      .kpi { font-size:40px; font-weight:700; }
      .h1 { font-size:34px; font-weight:700; }
      .h2 { font-size:24px; font-weight:700; }
      .mono { font-family:Consolas,Menlo,monospace; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="820" rx="18"/>

  <text x="55" y="64" class="ink h1">Data Center Cooling Surrogate</text>
  <text x="55" y="96" class="muted body">Random-Forest surrogate + bounded optimization for engineering decision support</text>

  <rect x="55" y="122" width="1290" height="62" rx="12" fill="#eef5ff" stroke="#c4d7f2"/>
  <text x="78" y="151" class="ink small" font-weight="700">Physics-first guardrail</text>
  <text x="78" y="174" class="muted small">Predictions outside the observed training range are flagged instead of being presented as trustworthy.</text>

  <rect x="55" y="212" width="380" height="545" rx="16" class="panel"/>
  <text x="82" y="252" class="ink h2">Cooling inputs</text>
  <text x="82" y="278" class="muted small">Adjust operating conditions</text>

  <text x="82" y="323" class="ink small">Air flow</text>
  <rect x="82" y="339" width="300" height="10" rx="5" class="soft"/>
  <rect x="82" y="339" width="184" height="10" rx="5" class="accent"/>
  <circle cx="266" cy="344" r="10" fill="#ffffff" stroke="#2764b8" stroke-width="4"/>

  <text x="82" y="388" class="ink small">Cooling output</text>
  <rect x="82" y="404" width="300" height="10" rx="5" class="soft"/>
  <rect x="82" y="404" width="156" height="10" rx="5" class="accent"/>
  <circle cx="238" cy="409" r="10" fill="#ffffff" stroke="#2764b8" stroke-width="4"/>

  <text x="82" y="453" class="ink small">Evaporator fan speed</text>
  <rect x="82" y="469" width="300" height="10" rx="5" class="soft"/>
  <rect x="82" y="469" width="226" height="10" rx="5" class="accent"/>
  <circle cx="308" cy="474" r="10" fill="#ffffff" stroke="#2764b8" stroke-width="4"/>

  <text x="82" y="518" class="ink small">Return air temperature</text>
  <rect x="82" y="534" width="300" height="10" rx="5" class="soft"/>
  <rect x="82" y="534" width="192" height="10" rx="5" class="accent"/>
  <circle cx="274" cy="539" r="10" fill="#ffffff" stroke="#2764b8" stroke-width="4"/>

  <text x="82" y="583" class="ink small">Supply air temperature</text>
  <rect x="82" y="599" width="300" height="10" rx="5" class="soft"/>
  <rect x="82" y="599" width="132" height="10" rx="5" class="accent"/>
  <circle cx="214" cy="604" r="10" fill="#ffffff" stroke="#2764b8" stroke-width="4"/>

  <text x="82" y="655" class="ink small">Safety limit</text>
  <rect x="82" y="672" width="145" height="52" rx="10" class="soft"/>
  <text x="105" y="706" class="ink body" font-weight="700">33.8 °C</text>

  <rect x="468" y="212" width="877" height="207" rx="16" class="panel"/>
  <text x="495" y="252" class="ink h2">Hotspot prediction</text>
  <text x="495" y="278" class="muted small">Example dashboard view using the documented project result</text>

  <rect x="495" y="304" width="240" height="86" rx="12" class="soft"/>
  <text x="515" y="329" class="muted label">PREDICTED MAX TEMP</text>
  <text x="515" y="372" class="ink kpi">33.71 °C</text>

  <rect x="754" y="304" width="240" height="86" rx="12" fill="#edf8f2" stroke="#c6e6d4"/>
  <text x="774" y="329" class="muted label">SAFETY STATUS</text>
  <text x="774" y="372" class="good kpi">SAFE</text>

  <rect x="1013" y="304" width="300" height="86" rx="12" fill="#fff7e6" stroke="#ead29b"/>
  <text x="1033" y="329" class="muted label">TRAINED-RANGE CHECK</text>
  <text x="1033" y="370" class="warn body" font-weight="700">Inside bounded range</text>

  <rect x="468" y="445" width="545" height="312" rx="16" class="panel"/>
  <text x="495" y="486" class="ink h2">Bounded optimization</text>
  <text x="495" y="512" class="muted small">Search only where the surrogate has evidence</text>

  <rect x="495" y="540" width="225" height="95" rx="12" fill="#edf8f2" stroke="#c6e6d4"/>
  <text x="515" y="568" class="muted label">PREDICTED HOTSPOT</text>
  <text x="515" y="614" class="good kpi">33.71 °C</text>

  <rect x="738" y="540" width="247" height="95" rx="12" fill="#eef5ff" stroke="#c4d7f2"/>
  <text x="758" y="568" class="muted label">COOLING-POWER RESULT</text>
  <text x="758" y="614" class="accent kpi">−23.5%</text>

  <text x="495" y="676" class="ink small" font-weight="700">Recommendation logic</text>
  <text x="495" y="706" class="muted small">Minimum cooling-power proxy satisfying the temperature constraint</text>
  <text x="495" y="733" class="muted small">and remaining inside the surrogate's trained operating envelope.</text>

  <rect x="1038" y="445" width="307" height="312" rx="16" class="panel"/>
  <text x="1065" y="486" class="ink h2">Engineering context</text>

  <rect x="1065" y="523" width="253" height="54" rx="10" class="soft"/>
  <text x="1083" y="557" class="ink small" font-weight="700">Random Forest surrogate</text>

  <rect x="1065" y="592" width="253" height="54" rx="10" class="soft"/>
  <text x="1083" y="625" class="ink small" font-weight="700">Target: max rack temp</text>

  <rect x="1065" y="661" width="253" height="66" rx="10" fill="#fff3f1" stroke="#f1c2bc"/>
  <text x="1083" y="686" class="bad label">LIMITATION</text>
  <text x="1083" y="712" class="muted small">Narrow training window</text>

  <text x="55" y="797" class="muted small">Static README preview of the Stage 4 Streamlit interface. Run the app for live sliders, predictions and optimization.</text>
</svg>